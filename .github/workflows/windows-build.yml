name: Windows Build

# Windows Product Phase W2 — proves the app can be reliably built into a
# Windows PyInstaller onedir executable via GitHub Actions.
#
# Windows Product Phase W3 (added later, same workflow) — extends the W2
# onedir build with an Inno Setup installer (installer/diablo4companion.iss),
# compiled and silently installed on the same windows-latest runner as an
# authoritative correctness check (exe + all 26 builds/*.json + uninstaller
# present post-install, app launches without immediately crashing).
#
# Trigger choice: manual (workflow_dispatch) plus push to this repo's only
# branch (feature/dashboard-v2, there is no main) when build-relevant
# paths change. This phase explicitly excludes release automation /
# auto-tagging, so there is no `on: release` or version-tag trigger here —
# just a normal CI build trigger suitable for proving the pipeline works.
#
# Windows Product Phase W4 (added later, same workflow) — reads the one
# canonical version string from src/version.py and passes it into the
# Inno Setup compile step via /DMyAppVersion, instead of relying on the
# .iss file's own hardcoded fallback.
on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/dashboard-v2
    paths:
      - "src/**"
      - "main.py"
      - "requirements.txt"
      - "diablo4companion.spec"
      - "builds/**"
      - "installer/**"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: pyinstaller diablo4companion.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diablo4Companion-windows
          path: dist/Diablo4Companion/
          if-no-files-found: error

      # --- Windows Product Phase W3: Inno Setup installer -----------------

      # --- Windows Product Phase W4: canonical version -> installer -------

      - name: Read canonical app version
        shell: pwsh
        run: |
          $version = python -c "from src.version import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Failed to read __version__ from src/version.py" }
          Write-Host "Canonical app version: $version"
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate or install Inno Setup (ISCC)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC.exe not found at default pre-installed path, installing via choco..."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe still not found after choco install at expected path: $iscc"
          }
          Write-Host "Using ISCC at: $iscc"
          echo "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          & "$env:ISCC_PATH" "/DMyAppVersion=$env:APP_VERSION" "installer\diablo4companion.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }

      # --- Windows Product Phase W8: installer checksum sidecar -----------
      # No release is published by this workflow (deliberately out of
      # scope, see PROJECT_STATUS.md) - this only proves the real
      # SHA256-computation mechanism works and produces a genuine
      # checksum file as a CI artifact, ready to attach whenever the
      # user chooses to publish an actual release in a later phase.
      # src/updater.py's verify_download() is what a future release's
      # attached .sha256 file would be checked against.

      - name: Compute installer SHA256 checksum
        shell: pwsh
        run: |
          $setupExe = "installer\Output\Diablo4Companion-Setup.exe"
          $hash = Get-FileHash -Path $setupExe -Algorithm SHA256
          $hash.Hash.ToLower() | Out-File -FilePath "installer\Output\Diablo4Companion-Setup.exe.sha256" -Encoding ascii -NoNewline
          Write-Host "SHA256: $($hash.Hash.ToLower())"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diablo4Companion-Setup
          path: |
            installer/Output/Diablo4Companion-Setup.exe
            installer/Output/Diablo4Companion-Setup.exe.sha256
          if-no-files-found: error

      - name: Silent-install the installer for verification
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "D4CInstallTest"
          $setupExe = "installer\Output\Diablo4Companion-Setup.exe"
          Start-Process -FilePath $setupExe `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" `
            -Wait -PassThru | Out-Null
          echo "INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify installed files and uninstaller
        shell: pwsh
        run: |
          $installDir = $env:INSTALL_DIR
          Write-Host "Verifying install at: $installDir"

          $exe = Join-Path $installDir "Diablo4Companion.exe"
          if (-not (Test-Path $exe)) {
            throw "Diablo4Companion.exe not found at $exe after silent install"
          }
          Write-Host "OK: Diablo4Companion.exe present."

          # Compared against the checked-out source tree's real builds/*.json
          # count rather than a hardcoded literal (Windows Product Phase W10
          # added builds/manifest.json as a real 27th such file - a hardcoded
          # "26" broke the moment that legitimate file existed; deriving the
          # expected count from the actual source avoids this happening again
          # for any future addition/removal).
          $sourceBuildsDir = Join-Path $env:GITHUB_WORKSPACE "builds"
          $expectedJsonCount = (Get-ChildItem -Path $sourceBuildsDir -Filter "*.json" -File).Count

          $buildsDir = Join-Path $installDir "builds"
          $jsonFiles = Get-ChildItem -Path $buildsDir -Filter "*.json" -File -ErrorAction SilentlyContinue
          $jsonCount = if ($jsonFiles) { $jsonFiles.Count } else { 0 }
          if ($jsonCount -ne $expectedJsonCount) {
            throw "Expected $expectedJsonCount builds/*.json files in $buildsDir (matching the source tree), found $jsonCount"
          }
          Write-Host "OK: found all $expectedJsonCount builds/*.json files."

          # Windows Product Phase W4: best-effort check that the
          # /DMyAppVersion value we passed into ISCC made it into the
          # installed app's registered version metadata (Add/Remove
          # Programs). Informational only (Write-Warning, not throw) -
          # a throwaway /DIR= test install's registry visibility isn't
          # the thing this phase is actually proving, and the ISCC
          # compile step already succeeded using $env:APP_VERSION,
          # which is the real evidence the canonical value was consumed.
          $uninstKey = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Diablo 4 Companion" }
          if (-not $uninstKey) {
            Write-Warning "No Add/Remove Programs entry found for Diablo 4 Companion (non-fatal, informational check only)."
          } elseif ($uninstKey.DisplayVersion -ne $env:APP_VERSION) {
            Write-Warning "Installed DisplayVersion '$($uninstKey.DisplayVersion)' does not match canonical version '$env:APP_VERSION' (non-fatal)."
          } else {
            Write-Host "OK: installed DisplayVersion matches canonical version ($env:APP_VERSION)."
          }

          $uninst = Get-ChildItem -Path $installDir -Filter "unins*.exe" -File -ErrorAction SilentlyContinue
          if (-not $uninst) {
            throw "No unins*.exe uninstaller found in $installDir"
          }
          Write-Host "OK: uninstaller present ($($uninst.Name))."

      - name: Launch-check installed exe (offscreen smoke test)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = Join-Path $env:INSTALL_DIR "Diablo4Companion.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            throw "Diablo4Companion.exe exited immediately (exit code $($proc.ExitCode)) instead of staying running"
          }
          Write-Host "OK: process still running after 8s (PID $($proc.Id)); stopping it now."
          Stop-Process -Id $proc.Id -Force

      # --- Windows Product Phase W8: real subprocess.Popen smoke test -----
      # Decoupled from any GitHub Release concern - this only proves
      # src/updater.py's launch_installer() mechanism itself (a plain
      # subprocess.Popen([path], shell=False)) can actually spawn an
      # external Windows process without raising, using a harmless
      # real executable already present on the runner instead of a
      # real installer/release asset.
      - name: Test launch_installer() against a real Windows executable
        shell: pwsh
        env:
          PYTHONPATH: "."
        run: |
          python -c "
          import shutil
          from src.updater import launch_installer
          launch_installer(shutil.which('notepad.exe'))
          print('OK: launch_installer() spawned notepad.exe without raising')
          "
          Start-Sleep -Seconds 2
          Get-Process -Name notepad -ErrorAction SilentlyContinue | Stop-Process -Force

      # --- Windows Product Phase W9: Safe Rollback - real Windows backup/
      # cleanup/restore test ------------------------------------------------
      # Exercises src/updater.py's backup_install_dir/cleanup_backup/
      # restore_backup against the REAL installed app directory this
      # runner's own W3 silent-install step just produced above
      # ($env:INSTALL_DIR - real _internal/, real builds/, real exe, not a
      # fake fixture), and against the REAL install_dir/backup_root path
      # shapes this Windows environment actually produces (not a
      # Linux-simulated path shape). No GitHub Release involved at all -
      # pure local-filesystem testing of this phase's rollback primitives.
      - name: Test W9 backup/cleanup/restore against the real Windows install
        shell: pwsh
        env:
          PYTHONPATH: "."
        run: |
          $installDir = $env:INSTALL_DIR
          $backupRoot = Join-Path (Split-Path $installDir -Parent) "Diablo4Companion_backup"

          @'
          import os
          import sys

          from src import updater

          install_dir = sys.argv[1]
          backup_root = sys.argv[2]


          def count_and_size(path):
              total_count = 0
              total_size = 0
              for root, dirs, files in os.walk(path):
                  for f in files:
                      total_count += 1
                      total_size += os.path.getsize(os.path.join(root, f))
              return total_count, total_size


          src_count, src_size = count_and_size(install_dir)
          print(f"Source install dir: {src_count} files, {src_size} bytes")
          if src_count < 10:
              raise SystemExit(
                  f"Sanity check failed: real install dir only has {src_count} "
                  f"files - not a valid test target."
              )

          backup_path = updater.backup_install_dir(install_dir, backup_root, "9.9.9-citest")
          print(f"OK: backup_install_dir -> {backup_path}")

          dst_count, dst_size = count_and_size(backup_path)
          print(f"Backup dir: {dst_count} files, {dst_size} bytes")
          if dst_count != src_count or dst_size != src_size:
              raise SystemExit(
                  f"Backup mismatch: source had {src_count} files/{src_size} "
                  f"bytes, backup has {dst_count} files/{dst_size} bytes."
              )
          print("OK: backup is a complete, same-file-count-and-size copy of the real install.")

          # --- path-safety: refuse a real out-of-bounds Windows path --------
          outside_target = os.environ["SystemRoot"]  # e.g. C:\Windows
          before_exists = os.path.isdir(outside_target)
          updater.cleanup_backup(outside_target, backup_root)
          after_exists = os.path.isdir(outside_target)
          if not (before_exists and after_exists):
              raise SystemExit("cleanup_backup did not correctly refuse a real out-of-bounds Windows path!")
          print(f"OK: cleanup_backup correctly refused to touch {outside_target}.")

          # --- restore_backup refuses the REAL CI install dir name ----------
          # (this runner's real silent-install test dir is deliberately
          # named "D4CInstallTest", not "Diablo4Companion" - proving the
          # sanity check against the REAL path this Windows environment
          # actually produced, not a Linux-simulated shape.)
          try:
              updater.restore_backup(backup_path, install_dir, backup_root)
              raise SystemExit("restore_backup should have refused the real CI install dir name but did not!")
          except ValueError as exc:
              print(f"OK: restore_backup correctly refused the real (non-Diablo4Companion-named) CI install dir: {exc}")

          # --- restore_backup real copy mechanics, properly-named target ----
          restore_target = os.path.join(os.path.dirname(backup_root), "RestoreTest", "Diablo4Companion")
          os.makedirs(restore_target, exist_ok=True)
          marker = os.path.join(restore_target, "broken_marker.txt")
          with open(marker, "w") as fh:
              fh.write("simulated broken newly-installed version")

          updater.restore_backup(backup_path, restore_target, backup_root)
          if os.path.exists(marker):
              raise SystemExit("restore_backup did not clear the pre-existing install_dir contents before restoring.")
          restored_exe = os.path.join(restore_target, "Diablo4Companion.exe")
          if not os.path.isfile(restored_exe):
              raise SystemExit(f"restore_backup did not restore the real exe to {restored_exe}")
          print("OK: restore_backup correctly cleared the old contents and restored the real exe.")

          # --- cleanup_backup real removal -----------------------------------
          updater.cleanup_backup(backup_path, backup_root)
          if os.path.exists(backup_path):
              raise SystemExit(f"cleanup_backup did not remove {backup_path}")
          print("OK: cleanup_backup actually removed the real backup directory.")

          print("ALL W9 REAL-WINDOWS CHECKS PASSED")
          '@ | Out-File -FilePath w9_ci_test.py -Encoding utf8

          python w9_ci_test.py $installDir $backupRoot
          if ($LASTEXITCODE -ne 0) { throw "W9 backup/cleanup/restore test failed" }

      # --- DIAGNOSTIC (temporary): reproduce the user's real-Windows report
      # that clicking "Update Now" does nothing at all in the installed app,
      # by exercising _on_update_now_clicked exactly as a frozen Windows
      # build would, against the REAL v1.0.1 GitHub Release, on this real
      # Windows runner. launch_installer() itself is stubbed out here only
      # to avoid popping an unattended interactive installer wizard in CI -
      # every other real step (check for updates, download, verify, backup)
      # runs for real. Reports the exact sequence of status-label text and
      # any exception, so the real root cause can be pinned down with
      # evidence instead of guessing further.
      - name: DIAGNOSTIC - reproduce Update Now against the real v1.0.1 release
        shell: pwsh
        env:
          PYTHONPATH: "."
          QT_QPA_PLATFORM: "offscreen"
        run: |
          $installDir = $env:INSTALL_DIR
          @'
          import sys
          import traceback

          from PySide6.QtWidgets import QApplication
          app = QApplication(sys.argv)

          sys.frozen = True
          sys.executable = sys.argv[1] + "\\Diablo4Companion.exe"

          import src.app as appmod
          from src.app import MainWindow

          # Simulate the exact real-world scenario reported: an installed
          # 1.0.0 build checking against the real, now-published v1.0.1.
          appmod.__version__ = "1.0.0"

          # Stub launch_installer only - never actually pop an interactive
          # installer wizard in unattended CI. Everything before it runs for
          # real (real GitHub API call, real download, real verify, real
          # backup against this runner's real install directory).
          launch_calls = []
          def _stub_launch_installer(path):
              launch_calls.append(path)
          appmod.updater.launch_installer = _stub_launch_installer

          w = MainWindow()
          si = w.settings_interface

          status_history = []
          orig_set_text = si.update_status_label.setText
          def _tracking_set_text(text):
              status_history.append(text)
              print(f"[status] {text}")
              orig_set_text(text)
          si.update_status_label.setText = _tracking_set_text

          si._on_check_updates_clicked()
          print("Check for Updates result:", si.update_status_label.text())
          if si._pending_update_release is None:
              raise SystemExit("DIAGNOSTIC FAILED: Check for Updates did not find v1.0.1 - cannot proceed to Update Now test.")
          print("Confirmed: newer release found, Update Now button hidden =", si.update_now_button.isHidden())

          status_history.clear()
          print("--- Calling _on_update_now_clicked() ---")
          try:
              si._on_update_now_clicked()
          except Exception as exc:
              print(f"EXCEPTION RAISED: {type(exc).__name__}: {exc}")
              traceback.print_exc()
              raise SystemExit(f"DIAGNOSTIC: _on_update_now_clicked raised {type(exc).__name__}: {exc}")

          print("--- Status history during Update Now ---")
          for i, s in enumerate(status_history):
              print(f"  {i}: {s}")

          print("launch_installer called with:", launch_calls)

          if not launch_calls:
              raise SystemExit("DIAGNOSTIC FAILED: launch_installer was never reached - the flow stopped somewhere before installing.")

          print("DIAGNOSTIC: full flow reached launch_installer successfully.")
          '@ | Out-File -FilePath diagnostic_update_now.py -Encoding utf8

          python diagnostic_update_now.py $installDir
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic script failed - see output above for the exact failure point." }
